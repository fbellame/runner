name: Runner
options:
  bundleIdPrefix: com.farid
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Runner:
    type: application
    platform: iOS
    sources:
      - Runner
    dependencies:
      - target: RunnerWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farid.runner
        PRODUCT_NAME: Runner
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Runner/Runner.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Runner/Info.plist
      properties:
        CFBundleDisplayName: Runner
        CFBundleShortVersionString: "1.11"
        CFBundleVersion: "25"
        CFBundleLocalizations: [en, fr]
        CFBundleDevelopmentRegion: en
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "Runner reads your daily steps and workouts to compute your daily points."
        NSHealthUpdateUsageDescription: "Runner saves your recorded runs, walks and rides to Apple Health so your data is permanently yours."
        NSLocationWhenInUseUsageDescription: "Runner uses your location to record your route while you run, walk or ride."
        NSLocationTemporaryUsageDescriptionDictionary:
          PreciseWorkout: "Precise location is needed to measure your distance and draw your route while recording a workout."
        NSMotionUsageDescription: "Runner uses motion activity to notice when you have been walking for a while, so it can record the walk for you."
        NSSupportsLiveActivities: true
        # Documents/Diagnostics holds the auto-pause traces: CSVs of raw lat/lon
        # whose first row is the front door. UIFileSharingEnabled and
        # LSSupportsOpeningDocumentsInPlace used to expose that folder in the
        # Files app and Finder, which is a standing disclosure to every app the
        # user ever hands a document picker to — not just to the field test it
        # was added for. Pulling a trace does not need them: devicectl reads the
        # app data container directly on a development build.
        #
        #   xcrun devicectl device copy from --device <UDID> \
        #     --domain-type appDataContainer --domain-identifier com.farid.runner \
        #     --source Documents/Diagnostics --destination ./pull/
        #
        # SessionTrace.excludeFromBackup keeps the same folder out of backups.
        UIBackgroundModes: [location, audio]
        INAlternativeAppNames:
          - INAlternativeAppName: Course
          - INAlternativeAppName: Run
        ITSAppUsesNonExemptEncryption: false
  RunnerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RunnerWidgets
      - path: Runner/Core/Recording/RunAttributes.swift
      - path: Runner/Core/Recording/RunActivityAttributes.swift
      - path: Runner/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.farid.runner.widgets
        PRODUCT_NAME: RunnerWidgets
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: RunnerWidgets/Info.plist
      properties:
        CFBundleDisplayName: Runner
        CFBundleShortVersionString: "1.11"
        CFBundleVersion: "25"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
  RunnerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RunnerTests
    dependencies:
      - target: Runner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # XcodeGen sets TEST_HOST/BUNDLE_LOADER automatically for unit-test
        # targets that depend on an app target — do not set them by hand.
schemes:
  Runner:
    build:
      targets:
        Runner: all
    test:
      # On by default so `xcodebuild test` always reports the number.
      # It was off, which is why the app target's 36.9% line coverage
      # went unmeasured through four releases.
      gatherCoverageData: true
      targets:
        - RunnerTests
    run:
      config: Debug
